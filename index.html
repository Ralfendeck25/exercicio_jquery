<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" />
	<link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            cursor: pointer;
            padding: 10px;
			background: #f2f2f2;;
            margin: 5px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        li:hover {
			background: #ddd;
        }
        .completed {
            text-decoration: line-through;
            color: grey;
        }

		button {
			padding: 8px;
			background-color: #65ec69;
			color: white;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			transition: background-color 0.3s;
		}

		button:hover {
			background-color: #06d911;
		}
    </style>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    <form id="form">
        <input type="text" id="input" placeholder="Digite uma tarefa" required>
        <button type="submit">Adicionar</button>
    </form>
    <ul id="lista"></ul>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
    <script>
        $(document).ready(function() {
            $('#form').submit(function(event) {
                event.preventDefault();
                let taskText = $('#input').val().trim();
                if (taskText !== "") {
                    $('#lista').append('<li>' + taskText + '</li>');
                    $('#input').val('');
                }
            });

            $('#lista').on('click', 'li', function() {
                $(this).toggleClass('completed');
            });
        });
    </script>
</body>
</html>
